<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Operator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">/agents</div>
            </div>
            <div class="sidebar-content">
                <!-- Sidebar content will go here -->
            </div>
        </div>
        
        <div class="main-content">
            <div class="profile-section">
                <div class="profile-box">
                    <div class="profile-text">You are a <span class="profile-role">...</span></div>
                    <div class="profile-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 15C15.3137 15 18 12.3137 18 9C18 5.68629 15.3137 3 12 3C8.68629 3 6 5.68629 6 9C6 12.3137 8.68629 15 12 15Z" stroke="#00FF66" stroke-width="1.5"/>
                            <path d="M2.90625 20.2491C3.82834 18.6531 5.1542 17.3278 6.75064 16.4064C8.34708 15.485 10.1579 15 12.0011 15C13.8444 15 15.6552 15.4851 17.2516 16.4065C18.848 17.3279 20.1739 18.6533 21.0959 20.2493" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                
                <div class="profile-arrow">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5L12 19" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19 12L12 19L5 12" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <div class="profile-outline">
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M60 30C46.7 30 36 40.7 36 54C36 67.3 46.7 78 60 78C73.3 78 84 67.3 84 54C84 40.7 73.3 30 60 30ZM60 72C50 72 42 64 42 54C42 44 50 36 60 36C70 36 78 44 78 54C78 64 70 72 60 72Z" stroke="#00FF66" stroke-width="1.5"/>
                        <path d="M60 78C46.7 78 36 88.7 36 102M60 78C73.3 78 84 88.7 84 102" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                
                <div class="control-bars">
                    <div class="control-bar"></div>
                    <div class="control-bar"></div>
                    <div class="control-bar"></div>
                </div>
            </div>
            
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be added here -->
                </div>
                
                <div class="chat-input-container">
                    <input type="text" id="chat-input" placeholder="Type your message..." />
                    <button id="send-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <div class="footer-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="#00FF66" stroke-width="1.5"/>
                    <path d="M3 9H21" stroke="#00FF66" stroke-width="1.5"/>
                    <path d="M9 21L9 9" stroke="#00FF66" stroke-width="1.5"/>
                </svg>
                <span>unified API</span>
            </div>
            <div class="footer-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 5C21 6.65685 16.9706 8 12 8C7.02944 8 3 6.65685 3 5M21 5C21 3.34315 16.9706 2 12 2C7.02944 2 3 3.34315 3 5M21 5V19C21 20.6569 16.9706 22 12 22C7.02944 22 3 20.6569 3 19V5M21 12C21 13.6569 16.9706 15 12 15C7.02944 15 3 13.6569 3 12" stroke="#00FF66" stroke-width="1.5"/>
                </svg>
                <span>memory</span>
            </div>
            <div class="footer-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 8C21 11.3137 16.9706 14 12 14C7.02944 14 3 11.3137 3 8M21 8C21 4.68629 16.9706 2 12 2C7.02944 2 3 4.68629 3 8M21 8V16C21 19.3137 16.9706 22 12 22C7.02944 22 3 19.3137 3 16V8" stroke="#00FF66" stroke-width="1.5"/>
                </svg>
                <span>llm</span>
            </div>
            <div class="footer-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10.5 8.5L13.5 11.5L10.5 14.5" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3Z" stroke="#00FF66" stroke-width="1.5"/>
                </svg>
                <span>tools</span>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
