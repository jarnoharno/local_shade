<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Operator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="typing-indicator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">/agents</div>
                <div class="profile-section">
                    <div class="profile-dropdown">
                        <span>You are a...</span>
                        <i class="fas fa-cog settings-icon"></i>
                    </div>
                    <div class="profile-avatar">
                        <svg viewBox="0 0 100 100" class="avatar-svg">
                            <path d="M50,20 C60,20 70,30 70,45 C70,60 60,70 50,70 C40,70 30,60 30,45 C30,30 40,20 50,20 Z" fill="none" stroke="#00FF66" stroke-width="2"></path>
                            <path d="M30,85 C30,75 40,65 50,65 C60,65 70,75 70,85" fill="none" stroke="#00FF66" stroke-width="2"></path>
                            <circle cx="50" cy="40" r="3" fill="#00FF66"></circle>
                        </svg>
                    </div>
                </div>
            </div>
        </header>
        
        <main class="app-main">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be added here dynamically -->
                </div>
                <div class="chat-input-container">
                    <textarea id="chatInput" placeholder="Type your message here..." class="chat-input"></textarea>
                    <button id="sendButton" class="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
        
        <footer class="app-footer">
            <div class="footer-item">
                <i class="fas fa-plug"></i>
                <span>unified API</span>
            </div>
            <div class="footer-item">
                <i class="fas fa-memory"></i>
                <span>memory</span>
            </div>
            <div class="footer-item">
                <i class="fas fa-brain"></i>
                <span>llm</span>
            </div>
            <div class="footer-item">
                <i class="fas fa-tools"></i>
                <span>tools</span>
            </div>
        </footer>
    </div>

    <script src="api_connector.js"></script>
    <script src="script.js"></script>
</body>
</html>
