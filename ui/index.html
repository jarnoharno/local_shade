<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Operator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">/agents</div>
            </div>
        </header>
        
        <main class="app-main">
            <div class="agent-profile">
                <div class="agent-type">
                    <span>You are a</span>
                    <div class="agent-dropdown">
                        <span id="current-agent-type">...</span>
                        <div class="agent-dropdown-content">
                            <div class="agent-option" data-type="developer">developer</div>
                            <div class="agent-option" data-type="researcher">researcher</div>
                            <div class="agent-option" data-type="assistant">assistant</div>
                            <div class="agent-option" data-type="data analyst">data analyst</div>
                        </div>
                    </div>
                    <button class="settings-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
                            <path fill="#00FF66" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5zm7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
                        </svg>
                    </button>
                </div>
                <div class="agent-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
                        <path fill="none" stroke="#00FF66" stroke-width="2" d="M50 10 C 60 20, 80 20, 90 10 M10 50 C 20 40, 20 20, 10 10 M90 90 C 80 80, 80 60, 90 50 M10 90 C 20 80, 40 80, 50 90" />
                        <path fill="none" stroke="#00FF66" stroke-width="2" d="M30 40 Q 50 70, 70 40" />
                        <circle cx="30" cy="30" r="5" fill="#00FF66" />
                        <circle cx="70" cy="30" r="5" fill="#00FF66" />
                    </svg>
                </div>
            </div>

            <div class="tabs-container">
                <div class="tabs">
                    <div class="tab active" data-tab="chat">Chat</div>
                    <div class="tab" data-tab="planning">Planning</div>
                </div>
                <div class="tab-content">
                    <div class="tab-pane active" id="chat-tab">
                        <div class="chat-container">
                            <div class="chat-messages" id="chat-messages">
                                <!-- Messages will be added here -->
                            </div>
                            <div class="chat-input-container">
                                <textarea id="chat-input" placeholder="Type your message here..."></textarea>
                                <button id="send-button">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                        <path fill="#00FF66" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane" id="planning-tab">
                        <div class="planning-container">
                            <div class="planning-section">
                                <h3>Planned Actions</h3>
                                <div class="action-list" id="planned-actions">
                                    <!-- Planned actions will be added here -->
                                </div>
                            </div>
                            <div class="planning-section">
                                <h3>Executing</h3>
                                <div class="action-list" id="executing-actions">
                                    <!-- Executing actions will be added here -->
                                </div>
                            </div>
                            <div class="planning-section">
                                <h3>Completed</h3>
                                <div class="action-list" id="completed-actions">
                                    <!-- Completed actions will be added here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="footer-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#00FF66" d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15c0-1.66 1.34-3 3-3h2c1.66 0 3 1.34 3 3v1H8v-1z"/>
                    <circle cx="12" cy="9" r="2" fill="#00FF66"/>
                </svg>
                <span>unified API</span>
            </div>
            <div class="footer-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#00FF66" d="M13 9h5.5L13 3.5V9M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4c0-1.11.89-2 2-2m9 16v-2H6v2h9m3-4v-2H6v2h12z"/>
                </svg>
                <span>memory</span>
            </div>
            <div class="footer-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#00FF66" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7zm1-11h-2v3H8v2h3v3h2v-3h3v-2h-3V8z"/>
                </svg>
                <span>llm</span>
            </div>
            <div class="footer-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#00FF66" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
                </svg>
                <span>tools</span>
            </div>
        </footer>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3>API Configuration</h3>
                    <div class="setting-item">
                        <label for="api-url">API URL</label>
                        <input type="text" id="api-url" value="http://localhost:8080">
                    </div>
                    <div class="setting-item">
                        <label for="api-key">API Key (if required)</label>
                        <input type="password" id="api-key">
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Model Settings</h3>
                    <div class="setting-item">
                        <label for="model-select">Model</label>
                        <select id="model-select">
                            <option value="gpt-4o">OpenAI - GPT-4o</option>
                            <option value="claude-3-opus">Anthropic - Claude 3 Opus</option>
                            <option value="qwen2.5:14b">Ollama - Qwen 2.5 14B</option>
                            <option value="llama3:70b">Ollama - Llama 3 70B</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="hosting-select">Hosting</label>
                        <select id="hosting-select">
                            <option value="openai">OpenAI</option>
                            <option value="anthropic">Anthropic</option>
                            <option value="ollama">Ollama (Local)</option>
                        </select>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>UI Settings</h3>
                    <div class="setting-item">
                        <label for="theme-select">Theme</label>
                        <select id="theme-select">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="accent-color">Accent Color</label>
                        <input type="color" id="accent-color" value="#00FF66">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="api-connector.js"></script>
    <script src="script.js"></script>
</body>
</html>
